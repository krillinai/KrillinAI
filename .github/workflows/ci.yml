name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version-file: runtime/krillinai/go.mod
          cache-dependency-path: runtime/krillinai/go.sum
      - name: Install CJK fonts
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends fonts-noto-cjk
      - run: pnpm install --frozen-lockfile
      - name: Validate writing templates
        run: pnpm --filter @opencreator/writing-templates test
      - name: Audit high severity dependencies
        run: pnpm audit --audit-level high --ignore-registry-errors
        timeout-minutes: 5
      - run: pnpm krillinai:test
      - name: Install CJK fonts for article PDF tests
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          test -f /usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc
          test -f /usr/share/fonts/opentype/noto/NotoSansCJK-Bold.ttc
      - name: Prepare Electron for desktop tests
        run: pnpm --filter @opencreator/desktop exec electron --version
      - run: pnpm test
      - run: pnpm release:verify-scheduled-task-upgrade
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm smoke:ci
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e apps/web/e2e/web-desktop-parity.spec.ts --project=chromium-desktop
      - run: pnpm perf:measure
      - run: pnpm perf:check
        env:
          OPENCREATOR_PERFORMANCE_RESULTS_REQUIRED: '1'
